<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__MSG_panelTitle__</title>
  </head>

  <body>
    <div class="container-fluid panel px-3 py-2">
      <div class="text-center">
        <h3 class="my-3">
          <span id="current-time-text">00:00</span>
        </h3>
        <div class="d-grid gap-2">
          <button
            type="button"
            class="btn btn-danger"
            id="tomato-button"
            tabindex="1"
          >
            __MSG_btn_tomato__
          </button>
          <button
            type="button"
            class="btn btn-secondary"
            id="short-break-button"
          >
            __MSG_btn_short_break__
          </button>
          <button
            type="button"
            class="btn btn-secondary"
            id="long-break-button"
          >
            __MSG_btn_long_break__
          </button>
          <button type="button" class="btn btn-warning" id="reset-button">
            __MSG_btn_reset__
          </button>
        </div>

        <div class="info-buttons">
          <button type="button" class="btn btn-link" id="stats-link">
            __MSG_label_stats__
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
