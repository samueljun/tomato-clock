<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__MSG_panelTitle__</title>
    <link
      rel="icon"
      type="image/png"
      href="/assets/images/tomato-favicon.ico"
    />
  </head>

  <body>
    <div class="container-fluid panel px-3 py-2">
      <div class="text-center">
        <h3 class="my-3">
          <span id="current-time-text">00:00</span>
        </h3>
        <div class="d-grid gap-2">
          <button
            type="button"
            class="btn btn-danger"
            id="tomato-button"
            tabindex="1"
          >
            <span class="spacer"></span>__MSG_btn_tomato__<span
              class="spacer"
            ></span>
          </button>
          <button
            type="button"
            class="btn btn-secondary"
            id="short-break-button"
          >
            <span class="spacer"></span>__MSG_btn_short_break__<span
              class="spacer"
            ></span>
          </button>
          <button
            type="button"
            class="btn btn-secondary"
            id="long-break-button"
          >
            <span class="spacer"></span>__MSG_btn_long_break__<span
              class="spacer"
            ></span>
          </button>
          <button type="button" class="btn btn-warning" id="reset-button">
            __MSG_btn_reset__
          </button>
        </div>

        <div class="info-buttons d-flex justify-content-center gap-2">
          <button
            type="button"
            class="btn btn-icon"
            id="stats-button"
            aria-label="__MSG_label_stats__"
            title="__MSG_label_stats__"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 20V10" />
              <path d="M18 20V4" />
              <path d="M6 20v-4" />
            </svg>
          </button>
          <button
            type="button"
            class="btn btn-icon"
            id="options-button"
            aria-label="__MSG_label_options__"
            title="__MSG_label_options__"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
              />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
